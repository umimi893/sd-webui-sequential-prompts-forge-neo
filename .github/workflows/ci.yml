name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      FORGE_NEO_CONTRACT_ROOT: ${{ github.workspace }}/.upstream/forge-neo
      DYNAMIC_PROMPTS_EXTENSION_ROOT: ${{ github.workspace }}/.upstream/sd-dynamic-prompts
    steps:
      - name: Checkout Sequential Prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout audited Forge Neo contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Haoming02/sd-webui-forge-classic
          ref: d2c29a6bc6cf834c83cdefed394062c2c3e58760
          path: .upstream/forge-neo
          fetch-depth: 1

      - name: Checkout audited Dynamic Prompts extension contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adieyal/sd-dynamic-prompts
          ref: de056ff8d80e4ad120e13a90cf200f3383f427c6
          path: .upstream/sd-dynamic-prompts
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned Dynamic Prompts parser dependency
        run: python -m pip install --disable-pip-version-check "dynamicprompts==0.31.0"

      - name: Compile
        run: python -m compileall -q seqprompt scripts tests tools

      - name: Diagnostics collector self-test
        run: python tools/collect_diagnostics.py --self-test

      - name: Unit, integration, and upstream contract tests
        run: python -m unittest discover -s tests -v
