name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dynamic Prompts test dependency
        run: python -m pip install "dynamicprompts~=0.31.0"
      - name: Compile
        run: python -m compileall -q seqprompt scripts tests
      - name: Unit and compatibility tests
        run: python -m unittest discover -s tests -v
